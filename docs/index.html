<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentPanel · Hardware Agent Studio M1</title><style>
:root{font:14px system-ui,-apple-system,sans-serif;color:#25334e;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button{cursor:pointer;font:inherit}input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd5e5;border-radius:7px;background:white;color:#26344d;width:100%}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;color:#66738e;margin:11px 0 6px}h1{font-size:25px;margin:0}h2{font-size:17px}h3{font-size:14px}.top{height:58px;background:white;border-bottom:1px solid #dfe5ee;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.logo{font-size:20px;font-weight:750;color:#1970cf}.logo small{font-size:12px;color:#7f8ba0;font-weight:400}.app{display:flex;min-height:calc(100vh - 58px)}aside{width:225px;background:#fff;border-right:1px solid #e0e5ed;padding:16px 10px;flex-shrink:0}.group{font-size:10px;color:#8994a9;margin:25px 15px 8px}.nav{display:block;width:100%;border:none;background:transparent;text-align:left;border-radius:7px;padding:12px 14px;color:#55637d}.nav.active{background:#e6f0ff;color:#146ac5;font-weight:650}main{flex:1;padding:28px;min-width:0;max-width:1600px}.eyebrow{font-size:12px;color:#8898ad;margin-bottom:12px}.muted{color:#8390a6}.subtitle{margin-top:6px;color:#7c8ba1}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.panel{background:white;border:1px solid #e0e7f1;border-radius:12px;padding:21px;margin-top:16px;box-shadow:0 2px 6px #26384b07}.btn{background:#1976d2;color:#fff;border:1px solid #1976d2;padding:9px 15px;border-radius:7px}.btn.secondary{background:#fff;color:#355676;border-color:#cdd8e8}.btn:disabled{opacity:.48;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.two{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(320px,1fr);gap:16px}.stat{font-size:29px;font-weight:750}.notice{padding:12px 15px;background:#eef5ff;border:1px solid #bad4fa;border-radius:8px;color:#2a5e97;margin:15px 0}.tag{display:inline-block;padding:4px 7px;background:#eef4fc;color:#2665a7;border-radius:5px;font-size:11px}.danger{background:#fff2e8;color:#b25b2b}.tabs{display:flex;gap:5px;border-bottom:1px solid #e4eaf2;margin-top:18px}.tab{padding:11px 15px;background:none;border:0;border-bottom:2px solid transparent;color:#75839a}.tab.active{color:#166aca;border-color:#166aca;font-weight:650}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eef1f5;padding:12px 9px}th{font-size:12px;color:#7b879a}.link{border:0;background:none;color:#1976d2}.blank{padding:22px;color:#7f8da1;text-align:center}.node{display:flex;gap:12px;align-items:center;padding:15px;margin:12px 0;border:1px solid #d5e2f4;border-left:4px solid #3482e8;background:#f8fbff;border-radius:8px}.node strong{min-width:96px}.node p{margin:3px 0;font-size:12px;color:#7b879e}.flowarrow{text-align:center;color:#8da9ce}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:#17264070;display:grid;place-items:center;padding:16px;z-index:3}.dialog{width:min(510px,100%);background:white;border-radius:12px;padding:24px;box-shadow:0 18px 70px #15203744}.hidden{display:none}.toast{position:fixed;bottom:20px;right:20px;padding:13px 18px;background:#223651;color:#fff;border-radius:7px;z-index:4}.code{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#f7f9fc;border:1px solid #e3e8f1;border-radius:7px;padding:12px}.badge{font-size:11px;background:#f2f4f8;padding:4px 8px;border-radius:5px}@media(max-width:950px){aside{width:155px}.two{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><header class="top"><div class="logo">◈ AgentPanel <small>Hardware Agent Studio</small></div><span class="tag">Interactive Prototype · Browser Storage</span></header><div class="app"><aside><div class="group">BUILD</div><button class="nav active" data-go="agents">◇ My Agents</button><button class="nav" data-go="workflow">⌘ Workflow Studio</button><button class="nav" data-go="skills">▦ Skills & Tools</button><div class="group">HARDWARE</div><button class="nav" data-go="devices">▣ Device Registry</button><button class="nav" data-go="sandbox">▤ Virtual Lab</button><div class="group">OPERATIONS</div><button class="nav" data-go="runs">◷ Execution Traces</button><button class="nav" data-go="release">↑ Releases</button></aside><main><div id="root"></div></main></div><div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div><script>const KEY='agentpanel-studio-m1-v1';
const blank=()=>({agents:[],devices:[],runs:[],releases:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.agents)||!Array.isArray(db.devices)||!Array.isArray(db.runs))db=blank();
let page='agents',selected=null,tab='settings';const E=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(msg){const e=E('toast');e.textContent=msg;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3200)}
function heading(title,sub,action=''){return '<div class="eyebrow">Developer Console / Hardware Agent / '+safe(title)+'</div><div class="toolbar"><div><h1>'+safe(title)+'</h1><div class="subtitle">'+safe(sub)+'</div></div>'+action+'</div>'}
const notice='<div class="notice">交互原型：可编辑并持久保存配置，可运行浏览器内模拟设备及故障注入。没有真实 AgentScope、LLM、Tuya 云连接、VM 隔离或物理效果证据。</div>';
function sel(arr,get){return arr.map(x=>'<option value="'+safe(x.id)+'">'+safe(get(x))+'</option>').join('')}
function render(){document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===page));let h='';
if(page==='agents'){h=heading('My Agents','Create and manage hardware Agent applications','<button class="btn" onclick="newAgent()">＋ Create Agent</button>')+notice+'<div class="grid"><div class="panel"><span class="muted">Agents</span><div class="stat">'+db.agents.length+'</div></div><div class="panel"><span class="muted">Virtual Devices</span><div class="stat">'+db.devices.length+'</div></div><div class="panel"><span class="muted">Runs</span><div class="stat">'+db.runs.length+'</div></div></div><section class="panel"><h2>Agent Applications</h2><table><thead><tr><th>Name</th><th>Model</th><th>Devices</th><th>State</th><th>Action</th></tr></thead><tbody>'+db.agents.map(a=>'<tr><td><strong>'+safe(a.name)+'</strong><br><span class="muted">'+safe(a.tenant)+'</span></td><td>'+safe(a.model)+'</td><td>'+a.devices.length+'</td><td><span class="tag">DRAFT</span></td><td><button class="link" onclick="openAgent(\''+a.id+'\')">Develop →</button></td></tr>').join('')+'</tbody></table>'+(db.agents.length?'':'<div class="blank">No applications. Create your first Agent without needing a device.</div>')+'</section>'}
else if(page==='develop'){let a=db.agents.find(x=>x.id===selected);if(!a){page='agents';return render()}let d=db.devices.filter(x=>x.tenant===a.tenant),available=d.filter(x=>!a.devices.includes(x.id));h=heading('Agent Development',a.name,'<button class="btn secondary" onclick="go(\'agents\')">← My Agents</button>')+notice+'<div class="tabs">'+[['settings','Configuration'],['flow','Workflow'],['debug','Online Debug'],['versions','Releases']].map(([v,t])=>'<button class="tab '+(tab===v?'active':'')+'" onclick="changeTab(\''+v+'\')">'+t+'</button>').join('')+'</div>';
if(tab==='settings'){h+='<div class="two"><section class="panel"><h2>01 Model & Persona</h2><label>Model preset</label><select id="model">'+['local-mock','gpt-4o','qwen3','custom'].map(m=>'<option '+(a.model===m?'selected':'')+'>'+m+'</option>').join('')+'</select><label>System Prompt</label><textarea id="prompt">'+safe(a.prompt)+'</textarea><label>Allowed tenant</label><input disabled value="'+safe(a.tenant)+'"><div class="actions"><button class="btn" onclick="saveSettings()">Save Agent Config</button></div><p class="muted">Model preset only; no model API is invoked.</p></section><section class="panel"><h2>02 Device Binding</h2><p class="muted">Bound devices: '+a.devices.length+'</p><select id="binding">'+sel(available,x=>x.name+' / '+x.type)+'</select><div class="actions"><button class="btn secondary" '+(available.length?'':'disabled')+' onclick="bind()">Bind selected device</button><button class="btn secondary" onclick="go(\'devices\')">Add Virtual Device</button></div>'+a.devices.map(id=>{let v=db.devices.find(x=>x.id===id);return v?'<div class="node"><strong>'+safe(v.name)+'</strong><span class="tag">'+safe(v.type)+'</span><button class="link" onclick="unbind(\''+id+'\')">Unbind</button></div>':''}).join('')+'</section></div>'}
if(tab==='flow')h+=flowUI(a);
if(tab==='debug')h+=debugUI(a);
if(tab==='versions')h+='<section class="panel"><h2>Draft & Test Snapshots</h2><p>Save a versioned draft snapshot. This is not a production release.</p><button class="btn" onclick="snapshot()">Save Draft Version</button><table><tr><th>Version</th><th>Saved At</th><th>Environment</th></tr>'+db.releases.filter(x=>x.agentId===a.id).map(x=>'<tr><td>'+x.version+'</td><td>'+safe(x.at)+'</td><td>BROWSER_ONLY</td></tr>').join('')+'</table></section>'}
else if(page==='devices'){h=heading('Device Registry','Create virtual lights, climate units and sensors','<button class="btn" onclick="newDevice()">＋ Add Virtual Device</button>')+notice+'<div class="grid">'+db.devices.map(d=>'<section class="panel"><h3>▣ '+safe(d.name)+'</h3><div class="muted">'+safe(d.type)+' · '+safe(d.tenant)+'</div><p><span class="tag">BROWSER VIRTUAL</span></p><div class="stat">'+safe(String(d.value))+'</div><label>Fault injection</label><select onchange="fault(\''+d.id+'\',this.value)">'+['none','offline','drop_ack','stale_readback'].map(v=>'<option '+(d.fault===v?'selected':'')+'>'+v+'</option>').join('')+'</select></section>').join('')+'</div>'+(db.devices.length?'':'<div class="panel blank">No devices. Create a light, climate unit or sensor to begin.</div>')}
else if(page==='workflow'){h=heading('Workflow Studio','Configure and test reusable device action graphs')+notice+'<section class="panel"><h2>Select an Agent</h2><select id="select-agent" onchange="openAgent(this.value,\'flow\')"><option value="">Choose an agent</option>'+sel(db.agents,x=>x.name)+'</select><p class="muted">Workflow editor is currently a structured node editor, not yet a drag-and-drop graph engine.</p></section>'}
else if(page==='sandbox'){h=heading('Virtual Lab','Browser-based virtual fleet with failure injection')+notice+'<div class="grid">'+db.devices.map(d=>'<section class="panel"><h3>'+safe(d.name)+'</h3><p>'+safe(d.type)+'</p><span class="tag '+(d.fault==='none'?'':'danger')+'">'+safe(d.fault)+'</span><p>Value: '+safe(String(d.value))+'</p></section>').join('')+'</div><section class="panel"><h2>Sandbox boundaries</h2>Virtual devices are JavaScript state objects, not separate VMs/containers; failures are simulated, not network-level faults.</section>'}
else if(page==='runs'){h=heading('Execution Traces','Evidence-backed local simulation log')+notice+'<section class="panel"><table><thead><tr><th>Time</th><th>Agent</th><th>Device</th><th>Operation</th><th>Disposition</th></tr></thead><tbody>'+db.runs.map(r=>'<tr><td>'+safe(r.at)+'</td><td>'+safe(r.agent)+'</td><td>'+safe(r.device)+'</td><td>'+safe(r.op)+'</td><td><span class="tag">'+safe(r.status)+'</span></td></tr>').join('')+'</tbody></table>'+(db.runs.length?'':'<div class="blank">No run records yet.</div>')+'</section>'}
else if(page==='skills'){h=heading('Skills & Tools','Device capability registry')+notice+'<div class="grid">'+['lamp.set_power','climate.set_target_temperature','sensor.read'].map(x=>'<div class="panel"><h3>'+x+'</h3><p class="muted">Structured capability · Browser simulator</p></div>').join('')+'</div>'}
else if(page==='release'){h=heading('Releases','Draft snapshots (not deployments)')+notice+'<section class="panel"><table><tr><th>Agent</th><th>Version</th><th>Timestamp</th><th>Mode</th></tr>'+db.releases.map(x=>'<tr><td>'+safe(db.agents.find(a=>a.id===x.agentId)?.name||'deleted')+'</td><td>'+x.version+'</td><td>'+safe(x.at)+'</td><td>LOCAL SNAPSHOT</td></tr>').join('')+'</table></section>'}
E('root').innerHTML=h}
function flowUI(a){return '<div class="two"><section class="panel"><h2>Workflow Designer</h2><div class="node"><strong>01 · Trigger</strong><div>Manual test event<p>Application workflow start</p></div></div><div class="flowarrow">↓</div><div class="node"><strong>02 · Authority</strong><div>Agent-bound device only<p>Same tenant, exact capability</p></div></div><div class="flowarrow">↓</div><div class="node"><strong>03 · Device</strong><div>'+safe(a.steps.length)+' configured action(s)<p>Operations processed sequentially</p></div></div><div class="flowarrow">↓</div><div class="node"><strong>04 · Verify</strong><div>Cloud-free simulated readback<p>UNKNOWN if injected fault prevents certainty</p></div></div></section><section class="panel"><h2>Action Nodes</h2>'+a.steps.map((s,i)=>'<div class="node"><div style="flex:1"><strong>'+safe(s.capability)+'</strong><p>'+safe(db.devices.find(d=>d.id===s.deviceId)?.name||'missing')+' → '+safe(s.value)+'</p></div><button class="link" onclick="removeStep('+i+')">Remove</button></div>').join('')+'<label>Device</label><select id="step-device">'+sel(db.devices.filter(d=>a.devices.includes(d.id)),x=>x.name)+'</select><label>Capability</label><select id="step-cap">'+['lamp.set_power','climate.set_target_temperature','sensor.read'].map(x=>'<option>'+x+'</option>').join('')+'</select><label>Value (true/false, 16–30 °C, or read)</label><input id="step-value" value="true"><div class="actions"><button class="btn" onclick="addStep()">Add Node</button><button class="btn secondary" onclick="changeTab(\'debug\')">Test Workflow →</button></div></section></div>'}
function debugUI(a){return '<div class="two"><section class="panel"><h2>Live Debug · Browser Simulator</h2><p class="muted">Workflow: '+a.steps.length+' action nodes</p><button class="btn" '+(a.steps.length?'':'disabled')+' onclick="execute()">▶ Run Workflow</button><p class="muted">Inject offline or ACK-loss faults under Device Registry.</p><div id="debug-result" class="code">No run yet.</div></section><section class="panel"><h2>Device Observations</h2>'+a.devices.map(id=>{let d=db.devices.find(x=>x.id===id);return d?'<div class="node"><strong>'+safe(d.name)+'</strong><div>Value: '+safe(String(d.value))+'<p>Fault: '+safe(d.fault)+'</p></div></div>':''}).join('')+'</section></div>'}
function go(p){page=p;render()}function openAgent(id,t='settings'){selected=id;tab=t;page='develop';render()}function changeTab(t){tab=t;render()}
function showModal(inner){E('modal').className='modal';E('modal').innerHTML='<div class="dialog">'+inner+'</div>'}function closeModal(){E('modal').className='hidden';E('modal').innerHTML=''}
function newAgent(){showModal('<h2>Create Hardware Agent</h2><form id="create"><label>Name</label><input name="name" required pattern="[A-Za-z0-9_-]{1,48}"><label>Tenant</label><input name="tenant" value="lab" required pattern="[A-Za-z0-9_-]{1,48}"><div class="actions"><button class="btn" type="submit">Create Draft</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>');E('create').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const a={id:uid(),name:f.get('name'),tenant:f.get('tenant'),model:'local-mock',prompt:'You are a careful hardware assistant. Never assume an operation was physically completed.',devices:[],steps:[]};db.agents.push(a);save();closeModal();openAgent(a.id);toast('Draft Agent created — no runtime invoked')}}
function newDevice(){showModal('<h2>Add Virtual Device</h2><form id="create"><label>Name</label><input name="name" required pattern="[A-Za-z0-9_-]{1,48}"><label>Tenant</label><input name="tenant" value="lab" required pattern="[A-Za-z0-9_-]{1,48}"><label>Device Type</label><select name="type"><option value="lamp">Lamp</option><option value="climate">Climate</option><option value="sensor">Sensor</option></select><div class="actions"><button class="btn">Create Device</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>');E('create').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),type=f.get('type');db.devices.push({id:uid(),name:f.get('name'),tenant:f.get('tenant'),type,fault:'none',value:type==='lamp'?false:type==='climate'?22:20});save();closeModal();render();toast('Browser virtual device created')}}
function fault(id,v){const d=db.devices.find(x=>x.id===id);if(d){d.fault=v;save();render()}}
function saveSettings(){const a=db.agents.find(x=>x.id===selected);if(!a)return;a.model=E('model').value;a.prompt=E('prompt').value;save();toast('Configuration saved')}
function bind(){const a=db.agents.find(x=>x.id===selected),id=E('binding')?.value,d=db.devices.find(x=>x.id===id);if(!a||!d||a.tenant!==d.tenant)return toast('Same-tenant virtual device required');if(!a.devices.includes(id))a.devices.push(id);save();render();toast('Device bound')}
function unbind(id){const a=db.agents.find(x=>x.id===selected);a.devices=a.devices.filter(x=>x!==id);a.steps=a.steps.filter(x=>x.deviceId!==id);save();render()}
function addStep(){const a=db.agents.find(x=>x.id===selected),id=E('step-device')?.value,d=db.devices.find(x=>x.id===id),cap=E('step-cap').value,raw=E('step-value').value.trim();if(!d||!a.devices.includes(id))return toast('Bind a device first');let value=raw;if(cap==='lamp.set_power'){if(d.type!=='lamp'||!['true','false'].includes(raw))return toast('Lamp requires true or false');value=raw==='true'}else if(cap==='climate.set_target_temperature'){value=Number(raw);if(d.type!=='climate'||!Number.isFinite(value)||value<16||value>30)return toast('Temperature must be 16–30')}else{if(d.type!=='sensor')return toast('Read capability requires a sensor');value='read'}a.steps.push({deviceId:id,capability:cap,value});save();render();toast('Workflow node saved')}
function removeStep(i){const a=db.agents.find(x=>x.id===selected);a.steps.splice(i,1);save();render()}
function execute(){const a=db.agents.find(x=>x.id===selected);if(!a?.steps?.length)return;const logs=[];for(const s of a.steps){const d=db.devices.find(x=>x.id===s.deviceId);let status='DENIED';if(d&&d.tenant===a.tenant&&a.devices.includes(d.id)){if(d.fault==='offline')status='UNKNOWN_OFFLINE';else if(d.fault==='drop_ack'){if(s.capability!=='sensor.read')d.value=s.value;status='UNKNOWN_ACK_LOST'}else if(d.fault==='stale_readback')status='UNVERIFIED_STALE_STATE';else{if(s.capability!=='sensor.read')d.value=s.value;status='SIMULATED_CONFIRMED'}}let log={id:uid(),at:new Date().toISOString(),agent:a.name,device:d?.name||'missing',op:s.capability,status};db.runs.unshift(log);logs.push(log);if(status!=='SIMULATED_CONFIRMED')break}db.runs=db.runs.slice(0,250);save();render();E('debug-result').textContent=logs.map(x=>x.device+' · '+x.op+' · '+x.status).join('\n');toast('Simulation completed; no real device command')}
function snapshot(){const a=db.agents.find(x=>x.id===selected),n=db.releases.filter(x=>x.agentId===a.id).length+1;db.releases.unshift({id:uid(),agentId:a.id,version:'v0.'+n,at:new Date().toISOString(),snapshot:JSON.parse(JSON.stringify(a))});save();render();toast('Browser-only draft version saved')}
document.querySelectorAll('[data-go]').forEach(e=>e.addEventListener('click',()=>go(e.dataset.go)));render();</script></body></html>
