<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentPanel · GitHub Pages Preview</title><style>
:root{font:14px system-ui;color:#243046;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{height:62px;background:#fff;border-bottom:1px solid #dfe5ef;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.logo{font-size:22px;font-weight:750;color:#176bcb}.sub{color:#8390a4;font-size:12px}.wrap{display:flex;min-height:calc(100vh - 62px)}aside{width:235px;flex-shrink:0;background:#fff;border-right:1px solid #e0e5ed;padding:22px 12px}.heading{font-size:11px;color:#99a3b4;margin:18px 14px 9px}.nav{display:block;width:100%;text-align:left;padding:12px 14px;background:transparent;border:none;border-radius:7px;color:#56647a;cursor:pointer}.nav.selected{background:#e8f2ff;color:#1470d7;font-weight:650}main{flex:1;min-width:0;padding:30px;max-width:1400px}h1{font-size:26px;font-weight:650;margin:0 0 8px}.muted{color:#8592a5}.crumb{font-size:12px;color:#9aa6b5;margin-bottom:16px}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:9px;padding:23px;margin:16px 0;box-shadow:0 2px 7px #334b6208}.banner{border:1px solid #a8c7f5;background:#edf5ff;padding:12px 15px;color:#245c95;border-radius:7px;margin:20px 0}button{cursor:pointer}.primary{color:#fff;background:#1976d2;border:1px solid #1976d2;border-radius:6px;padding:10px 16px}.secondary{background:#fff;border:1px solid #cad5e5;color:#45607c;border-radius:6px;padding:9px 14px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.stat{font-size:27px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eef1f5;padding:15px 8px}th{background:#fafbfe;font-size:12px;color:#79879a}input,select{border:1px solid #cbd5e1;padding:10px;border-radius:6px;background:white;color:#283a55}label{display:block;margin:10px 0 5px;color:#5b6880;font-size:12px}.field{width:100%}.small{font-size:11px;color:#8a99aa}.tag{display:inline-block;border-radius:5px;padding:4px 8px;background:#fff5de;color:#a96b0a;font-size:11px}.link{border:0;background:transparent;color:#1375d4;padding:7px}.hidden{display:none}.overlay{position:fixed;inset:0;background:#1d2b4f77;display:grid;place-items:center;padding:20px}.dialog{background:#fff;width:min(480px,95vw);border-radius:12px;padding:24px;box-shadow:0 15px 65px #26395a44}.end{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.toast{position:fixed;bottom:22px;right:24px;background:#1b385f;color:white;border-radius:8px;padding:12px 20px}@media(max-width:720px){aside{width:155px}main{padding:18px}.top{padding:0 12px}} </style></head><body><header class="top"><div class="logo">◈ AgentPanel <span class="sub">Hardware Agent Studio</span></div><span class="tag">GitHub Pages · 浏览器模拟</span></header><div class="wrap"><aside><div class="heading">AI AGENT</div><button class="nav selected" data-page="agents">◇ My Agent</button><button class="nav" data-page="overview">◫ Overview</button><button class="nav" data-page="workflow">⌘ Workflow</button><button class="nav" data-page="mcp">◈ MCP Management</button><div class="heading">HARDWARE</div><button class="nav" data-page="devices">▣ Device Management</button><button class="nav" data-page="sandbox">▤ Sandbox</button><div class="heading">OPERATIONS</div><button class="nav" data-page="runs">◷ Run Logs</button><button class="nav" data-page="deploy">↑ Deployment</button></aside><main><div id="root"></div></main></div><div id="overlay" class="hidden"></div><div id="toast" class="toast hidden"></div><script>
const KEY='agentpanel-pages-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.agents)||!Array.isArray(state.devices)||!Array.isArray(state.runs))state={agents:[],devices:[],runs:[],status:{}};let page='agents',editing=null;const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const message=s=>{el('toast').textContent=s;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),3200)};const heading=(s,d,button='')=>'<div class="crumb">Developer Console / AI Agent / '+esc(s)+'</div><div class="head"><div><h1>'+esc(s)+'</h1><span class="muted">'+esc(d)+'</span></div>'+button+'</div>';const banner='<div class="banner">演示模式：数据只存在当前浏览器。未连接真实 AgentScope、Tuya Cloud、ESP32、服务端 IAM 或真实虚拟机。</div>';
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('selected',n.dataset.page===page));let h='';if(page==='agents'){h=heading('My Agent','Create, configure, test and manage AI Agent projects.','<button class="primary" onclick="dialog(\'agent\')">＋ Create Agent</button>')+banner+'<section class="panel"><h3>Self-Creation　　<span class="muted">Create Through Template（未接入）</span></h3><table><thead><tr><th>Agent Information</th><th>Agent ID</th><th>Tenant</th><th>Status</th><th>Operation</th></tr></thead><tbody>'+state.agents.map(a=>'<tr><td><strong>'+esc(a.name)+'</strong><div class="small">'+a.devices.length+' linked devices</div></td><td class="small">'+esc(a.id.slice(0,13))+'</td><td>'+esc(a.tenant)+'</td><td><span class="tag">CONFIG ONLY</span></td><td><button class="link" onclick="develop(\''+a.id+'\')">Develop</button></td></tr>').join('')+'</tbody></table>'+(state.agents.length?'':'<p class="muted">No agents yet. You can create an Agent without a virtual device.</p>')+'</section>'}else if(page==='devices'){h=heading('Device Management','Local virtual devices only','<button class="primary" onclick="dialog(\'device\')">＋ Add Virtual Device</button>')+banner+'<section class="panel"><table><thead><tr><th>Name</th><th>Tenant</th><th>Device ID</th><th>State</th></tr></thead><tbody>'+state.devices.map(d=>'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.tenant)+'</td><td class="small">'+esc(d.id.slice(0,14))+'</td><td><span class="tag">'+(state.status[d.id]?'ON':'OFF')+' / BROWSER</span></td></tr>').join('')+'</tbody></table></section>'}else if(page==='overview'){h=heading('Overview','Hardware Agent Studio development dashboard')+banner+'<div class="grid">'+[['Agents',state.agents.length],['Virtual Devices',state.devices.length],['Simulated Runs',state.runs.length],['Production Releases',0]].map(([n,v])=>'<div class="panel"><div class="muted">'+n+'</div><div class="stat">'+v+'</div></div>').join('')+'</div>'}else if(page==='develop'){const a=state.agents.find(a=>a.id===editing);if(!a){page='agents';return render()}const options=a.devices.map(id=>state.devices.find(d=>d.id===id)).filter(Boolean).map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('');const bindOptions=state.devices.filter(d=>d.tenant===a.tenant&&!a.devices.includes(d.id)).map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('');h=heading('Agent Development',a.name,'<button class="secondary" onclick="go(\'agents\')">← My Agent</button>')+banner+'<div class="grid"><section class="panel"><h3>01 Model Configuration</h3><label>Agent Name</label><input class="field" disabled value="'+esc(a.name)+'"><label>Runtime</label><input class="field" disabled value="CONFIG_ONLY_NO_AGENTSCOPE"><h3>02 Prompt & Tools</h3><p class="muted">LLM / Workflow / Skills are pending integration.</p></section><section class="panel"><h3>03 Online Debugging</h3><p class="muted">Bounded browser-only light simulation</p><label>Bound Device</label>'+(options?'<select id="run-device" class="field">'+options+'</select>':'<p class="muted">No device bound. Create one in Device Management, then bind it here.</p>')+'<label>Bind Virtual Device</label>'+(bindOptions?'<select id="bind-device" class="field">'+bindOptions+'</select><button class="secondary" onclick="bindDevice()">Bind device</button>':'<p class="muted">No unbound virtual devices in this tenant. <button class="secondary" onclick="go(\'devices\')">Add Virtual Device</button></p>')+'<label>Command</label><select id="run-power" class="field"><option value="true">lamp.set_power = true</option><option value="false">lamp.set_power = false</option></select><p><button class="primary" onclick="run()"'+(options?'':' disabled')+'>▶ Test Simulation</button></p><p id="out" class="small">No run yet.</p><h3>04 Release</h3><button class="secondary" disabled>Publish (not implemented)</button></section></div>'}else if(page==='runs'){h=heading('Run Logs','Browser-only simulation history')+banner+'<section class="panel"><table><thead><tr><th>Time</th><th>Agent</th><th>Device</th><th>Operation</th><th>Evidence</th></tr></thead><tbody>'+state.runs.map(r=>'<tr><td>'+esc(r.at)+'</td><td>'+esc(r.agentName)+'</td><td>'+esc(r.deviceName)+'</td><td>'+esc(r.on?'ON':'OFF')+'</td><td><span class="tag">BROWSER_ONLY</span></td></tr>').join('')+'</tbody></table></section>'}else{h=heading(page[0].toUpperCase()+page.slice(1),'UI placeholder · integration not implemented')+banner+'<section class="panel"><h3>Not connected yet</h3><p>Use AgentScope and official Tuya integrations when these platform features are implemented. This page is intentionally non-functional.</p></section>'}el('root').innerHTML=h}
function go(p){page=p;render()}document.querySelectorAll('[data-page]').forEach(n=>n.addEventListener('click',()=>go(n.dataset.page)));function develop(id){editing=id;go('develop')}
function bindDevice(){const a=state.agents.find(x=>x.id===editing),id=el('bind-device')?.value,d=state.devices.find(x=>x.id===id);if(!a||!d||a.tenant!==d.tenant)return message('Only same-tenant devices can be bound');if(!a.devices.includes(id))a.devices.push(id);save();render();message('Virtual device bound')}function dialog(kind){const devices=state.devices.map(d=>'<option value="'+d.id+'">'+esc(d.name)+' ('+esc(d.tenant)+')</option>').join('');el('overlay').className='overlay';el('overlay').innerHTML='<div class="dialog"><h2>'+(kind==='device'?'Add Virtual Device':'Create My AI Project')+'</h2><form id="new"><label>Name</label><input name="name" class="field" pattern="[A-Za-z0-9_-]{1,48}" required><label>Tenant</label><input name="tenant" class="field" value="lab" pattern="[A-Za-z0-9_-]{1,48}" required>'+(kind==='agent'?'<label>Bind Virtual Device (optional)</label><select name="device" class="field"><option value="">No device yet — bind later</option>'+devices+'</select>':'')+'<div class="end"><button class="secondary" type="button" onclick="closeDialog()">Cancel</button><button class="primary">OK</button></div></form></div>';el('new').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name'),tenant=f.get('tenant');if(kind==='device'){const id=crypto.randomUUID();state.devices.push({id,name,tenant});state.status[id]=false}else{const id=f.get('device'),d=state.devices.find(d=>d.id===id);if(id&&(!d||d.tenant!==tenant)){message('Cannot bind another tenant\'s device');return}state.agents.push({id:crypto.randomUUID(),name,tenant,devices:id?[id]:[]})}save();closeDialog();render();message('Saved to this browser only')}}function closeDialog(){el('overlay').className='hidden';el('overlay').innerHTML=''}
function run(){const a=state.agents.find(a=>a.id===editing),d=state.devices.find(d=>d.id===el('run-device').value);if(!a||!d||a.tenant!==d.tenant||!a.devices.includes(d.id))return message('Unauthorized device');const on=el('run-power').value==='true';state.status[d.id]=on;const r={at:new Date().toISOString(),agentName:a.name,deviceName:d.name,on};state.runs.unshift(r);state.runs=state.runs.slice(0,250);save();el('out').textContent='BROWSER_SIMULATED · lamp='+String(on)+' · no real hardware';message('Simulation completed — no device command sent')}
render();
</script></body></html>
