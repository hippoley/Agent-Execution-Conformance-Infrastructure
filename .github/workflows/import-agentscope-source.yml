name: Import AgentScope complete source (manual, one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agentscope-one-time-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Configure commit author
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "135493401+hippoley@users.noreply.github.com"
      - name: Import exact source and push review branch
        run: bash scripts/migrate_agentscope_exact.sh
