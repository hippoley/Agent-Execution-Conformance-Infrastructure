name: Vendor pinned AgentScope source (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-agentscope-manual
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure author
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "135493401+hippoley@users.noreply.github.com"
      - name: Import pinned upstream into review branch
        run: bash tools/vendor/import_agentscope_exact.sh
