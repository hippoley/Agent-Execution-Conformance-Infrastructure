name: Pinned TuyaOpen exact Git tree import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/tuyaopen-import-once-20261024.txt'
permissions:
  contents: write
concurrency:
  group: tuyaopen-full-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import pinned Git tree and verify remote main
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python3 - <<'PY'
          import json
          with open("upstreams/sources.lock.json") as f: data=json.load(f)
          print(next(x["commit"] for x in data["upstreams"] if x["name"]=="tuya/TuyaOpen"))
          PY
          )"
          PREFIX="third_party/sources/tuya__TuyaOpen"
          git fetch --no-tags --filter=blob:none https://github.com/tuya/TuyaOpen.git "$PIN"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$PIN"
          UPSTREAM_TREE="$(git rev-parse "$PIN^{tree}")"
          COUNT="$(git ls-tree -r "$UPSTREAM_TREE" | awk '$2=="blob"{n++}END{print n+0}')"
          test "$COUNT" -eq 13183
          test "$(git ls-tree -r "$UPSTREAM_TREE" | awk '$2=="commit"{n++}END{print n+0}')" -eq 4
          # Preserve official copyright material exactly; no transformations.
          git cat-file -e "$PIN:LICENSE"
          INDEX="$(mktemp)"
          rm -f "$INDEX"
          trap 'rm -f "$INDEX"' EXIT
          export GIT_INDEX_FILE="$INDEX"
          git read-tree HEAD
          git rm -rq --cached --ignore-unmatch -- "$PREFIX"
          git read-tree -i --prefix="$PREFIX/" "$UPSTREAM_TREE"
          NEW_TREE="$(git write-tree)"
          test "$(git rev-parse "$NEW_TREE:$PREFIX")" = "$UPSTREAM_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test "$(git rev-parse "HEAD:$PREFIX" 2>/dev/null || true)" != "$UPSTREAM_TREE"; then
            NEW_COMMIT="$(printf '%s\n' 'vendor(tuya): import exact pinned 13183-blob TuyaOpen tree' | git commit-tree "$NEW_TREE" -p HEAD)"
            git push origin "$NEW_COMMIT:refs/heads/main"
          fi
          git fetch --no-tags origin main
          REMOTE_TREE="$(git rev-parse "FETCH_HEAD:$PREFIX")"
          test "$REMOTE_TREE" = "$UPSTREAM_TREE"
          echo "PASS: remote main TuyaOpen tree $REMOTE_TREE equals upstream $UPSTREAM_TREE (13,183 blobs; 4 gitlinks)"
